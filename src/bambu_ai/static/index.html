<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bambu A1 AI Monitor</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#232a33;--fg:#e6edf3;--dim:#8b949e;
--ok:#3fb950;--warn:#d29922;--bad:#f85149;--accent:#58a6ff;--mono:ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 10px}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--dim)}
.pill{padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.pill.ok{background:rgba(63,185,80,.15);color:var(--ok)}
.pill.warn{background:rgba(210,153,34,.15);color:var(--warn)}
.pill.bad{background:rgba(248,81,73,.15);color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
img.cam{width:100%;border-radius:8px;background:#000;display:block}
.mono{font-family:var(--mono)}
button{background:var(--accent);border:0;color:#04121f;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.danger{background:var(--bad);color:#fff}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input[type=range]{width:140px;vertical-align:middle}
label{color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);color:var(--dim)}
td{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
<h1>Bambu A1 AI Monitor</h1>
<div class="sub">Local failure detection &amp; auto-pause</div>
<div class="grid">
  <div class="card">
    <h2>Printer</h2>
    <div class="row"><span>Printer</span><span id="printer" class="pill ok">—</span></div>
    <div class="row"><span>AI</span><span id="ai" class="pill ok">ENABLED</span></div>
    <div class="row"><span>Mode</span><span id="mode" class="pill warn">SHADOW</span></div>
    <div class="row"><span>Model</span><span id="model" class="mono">—</span></div>
    <div class="row"><span>Job</span><span id="job">—</span></div>
    <div class="row"><span>Progress</span><span id="progress">0%</span></div>
  </div>
  <div class="card">
    <h2>Latest inference</h2>
    <div class="row"><span>State</span><span id="state" class="pill ok">NORMAL</span></div>
    <div class="row"><span>Risk</span><span id="risk" class="mono">0.00</span></div>
    <div class="row"><span>Inference</span><span id="lat" class="mono">—</span></div>
    <div class="row"><span>Frames</span><span id="frames" class="mono">0</span></div>
    <div class="bar"><i id="riskbar"></i></div>
  </div>
  <div class="card" style="grid-column:1/-1">
    <h2>Camera</h2>
    <img class="cam" id="cam" alt="no frame">
  </div>
  <div class="card" style="grid-column:1/-1">
    <h2>Signals</h2>
    <table id="signals"></table>
  </div>
  <div class="card">
    <h2>Controls</h2>
    <div class="row"><label>Threshold</label><span class="mono" id="thval">0.90</span></div>
    <input type="range" id="th" min="0.5" max="1" step="0.01" value="0.9">
    <div class="row"><label>Sampling FPS</label><span class="mono" id="fpsval">1.0</span></div>
    <input type="range" id="fps" min="0.2" max="2" step="0.1" value="1">
    <div class="ctrl">
      <button id="toggle" class="ghost">Enable AI</button>
      <button id="shadow" class="ghost">Shadow</button>
      <button id="pause" class="danger">Pause</button>
      <button id="resume" class="ghost">Resume</button>
    </div>
  </div>
  <div class="card">
    <h2>Recent events</h2>
    <table id="events"><tbody></tbody></table>
  </div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
function pill(el,txt,cls){el.textContent=txt;el.className="pill "+cls;}
function setState(s){
  const cls=s==="NORMAL"?"ok":(s==="PAUSED_BY_AI"||s==="CONFIRMED_FAILURE"||s==="PAUSING"?"bad":"warn");
  pill($("state"),s,cls);
}
function riskColor(r){return r<0.5?"var(--ok)":r<0.9?"var(--warn)":"var(--bad)";}
async function refreshStatus(){
  const s=await (await fetch("/api/status")).json();
  const pr=s.printer||{};
  const st=pr.state||"unknown";
  pill($("printer"),(st||"unknown").toUpperCase(),st==="printing"?"ok":st==="paused"?"warn":"warn");
  pill($("ai"),s.enabled?"ENABLED":"DISABLED",s.enabled?"ok":"warn");
  pill($("mode"),s.auto_pause?"AUTO-PAUSE":"SHADOW",s.auto_pause?"bad":"warn");
  $("model").textContent=s.model;
  $("job").textContent=pr.job_name||"—";
  $("progress").textContent=Math.round(pr.progress_pct||0)+"%";
  setState(s.state);
  $("risk").textContent=(s.risk||0).toFixed(2);
  $("lat").textContent=(s.inference_ms? s.inference_ms.toFixed(0)+"ms":"—");
  $("frames").textContent=s.frames;
  $("riskbar").style.width=Math.min(100,(s.risk||0)*100)+"%";
  $("riskbar").style.background=riskColor(s.risk||0);
  const sig=$("signals");
  sig.innerHTML="<tr><th>signal</th><th>score</th></tr>";
  for(const [k,v] of Object.entries(s.signals||{})){
    sig.innerHTML+=`<tr><td>${k}</td><td class="mono">${(v||0).toFixed(2)}</td></tr>`;
  }
  const ev=$("events").querySelector("tbody");
  ev.innerHTML="";
  for(const e of (s.events||[])){
    const row=document.createElement("tr");
    [new Date(e.ts*1000).toLocaleTimeString(),e.type,e.risk,e.decision].forEach((v,i)=>{
      const cell=document.createElement("td"); cell.textContent=String(v); if(i===2) cell.className="mono"; row.appendChild(cell);
    }); ev.appendChild(row);
  }
}
async function refreshFrame(){
  try{
    const f=await (await fetch("/api/frame")).json();
    $("cam").src="data:image/jpeg;base64,"+f.b64;
  }catch(e){}
}
async function post(path){await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});}
$("th").oninput=e=>{$("thval").textContent=(+e.target.value).toFixed(2);};
$("th").onchange=e=>fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({threshold:+e.target.value})});
$("fps").oninput=e=>{$("fpsval").textContent=(+e.target.value).toFixed(1);};
const fpsEl=$("fps");fpsEl.addEventListener("change",()=>{
  fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fps:+fpsEl.value})});
});
$("toggle").onclick=()=>{const cur=$("ai").textContent!=="ENABLED";
  fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:cur})});};
$("shadow").onclick=()=>{const cur=!$("mode").textContent.includes("AUTO");
  fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({auto_pause:!cur})});};
$("pause").onclick=()=>post("/api/pause");
$("resume").onclick=()=>post("/api/resume");
setInterval(refreshStatus,1500);
setInterval(refreshFrame,1000);
refreshStatus();refreshFrame();
</script>
</body>
</html>
