[project]
name = "bambu-ai-guard"
version = "0.1.0"
description = "Local AI failure detection and auto-pause for Bambu Lab A1 (macOS / Apple Silicon)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "paho-mqtt>=1.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
model = [
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
bambu-ai = "bambu_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bambu_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
